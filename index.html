<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina</title>
    <meta name="description" content="An advanced AI workspace." />
    <meta property="og:title" content="Lumina" />
    <meta property="og:description" content="An advanced AI workspace with Omni-Cognitive Synthesis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        const msg = (event.reason && event.reason.message) || String(event.reason);
        if (msg.includes('WebSocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      const originalError = console.error;
      console.error = function(...args) {
        if (typeof args[0] === 'string' && (args[0].includes('failed to connect to websocket') || args[0].includes('WebSocket closed'))) return;
        originalError.apply(console, args);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
